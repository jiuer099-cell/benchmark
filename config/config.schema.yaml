$schema: https://json-schema.org/draft/2020-12/schema
$id: https://pgbench.local/schemas/config.schema.yaml
title: PGBench main configuration
type: object
additionalProperties: false
required:
  - schema_version
  - project
  - sample
  - reference
  - pangenome
  - truth
  - catalogs
  - execution
  - score
  - tools
  - external_plugins
properties:
  schema_version:
    const: 1
  project:
    type: object
    additionalProperties: false
    required: [id, run_id]
    properties:
      id:
        $ref: "#/$defs/identifier"
      run_id:
        $ref: "#/$defs/identifier"
  sample:
    type: object
    additionalProperties: false
    required:
      - id
      - sex
      - technology
      - library_id
      - source_evidence_id
      - coverage_x
      - read_count
      - read_bases
      - downsampling_seed
      - bam
      - fastq
    properties:
      id:
        $ref: "#/$defs/identifier"
      sex:
        enum: [male, female, unknown]
      technology:
        enum:
          - pacbio_clr
          - pacbio_hifi
          - ont
          - illumina_short_read
      library_id:
        $ref: "#/$defs/identifier"
      source_evidence_id:
        $ref: "#/$defs/identifier"
      coverage_x:
        oneOf:
          - type: number
            exclusiveMinimum: 0
          - type: "null"
      read_count:
        oneOf:
          - type: integer
            minimum: 1
          - type: "null"
      read_bases:
        oneOf:
          - type: integer
            minimum: 1
          - type: "null"
      downsampling_seed:
        oneOf:
          - type: integer
            minimum: 0
          - type: "null"
      bam:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      fastq:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      fastq_r1:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      fastq_r2:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      allow_sample_name_override:
        type: boolean
        default: false
  reference:
    type: object
    additionalProperties: false
    required: [id, fasta]
    properties:
      id:
        const: grch38
      fasta:
        $ref: "#/$defs/nonEmptyPath"
      fai:
        $ref: "#/$defs/nonEmptyPath"
      dict:
        $ref: "#/$defs/nonEmptyPath"
      sha256:
        $ref: "#/$defs/sha256OrNull"
  pangenome:
    type: object
    additionalProperties: false
    required:
      - id
      - backbone
      - population_panel
      - truth_leakage_policy
      - build_graph_assets
      - allele_namespace
      - population_vcf
      - graph_assets
      - excluded_samples
    properties:
      id:
        $ref: "#/$defs/identifier"
      backbone:
        const: grch38
      population_panel:
        $ref: "#/$defs/identifier"
      truth_leakage_policy:
        const: exclude_hg002_truth
      build_graph_assets:
        type: boolean
      allele_namespace:
        const: PGSV
      excluded_samples:
        type: array
        minItems: 1
        uniqueItems: true
        contains:
          const: HG002
        items:
          $ref: "#/$defs/identifier"
      manifest:
        $ref: "#/$defs/nonEmptyPath"
      population_vcf:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      graph_assets:
        type: object
        additionalProperties: false
        required:
          - profile
          - manifest
          - gbz
          - xg
          - min
          - dist
          - sample_list
          - reference_path
        properties:
          profile:
            enum:
              - none
              - vg_gbz_min_dist
              - vg_giraffe_shortread
              - vg_legacy_xg
              - svarp_minigraph_longread
          manifest:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          gbz:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          gfa:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          variation_calls:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          xg:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          min:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          zipcodes:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          dist:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          sample_list:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          reference_path:
            type: string
            minLength: 1
  truth:
    type: object
    additionalProperties: false
    required: [primary, secondary]
    properties:
      primary:
        $ref: "#/$defs/identifier"
      secondary:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/identifier"
  catalogs:
    type: object
    additionalProperties: false
    required:
      - truthsets
      - stratifications
      - score_weights
      - evaluator_profile
      - novel_truth_profile
      - metric_dictionary
    properties:
      truthsets:
        $ref: "#/$defs/nonEmptyPath"
      stratifications:
        $ref: "#/$defs/nonEmptyPath"
      score_weights:
        $ref: "#/$defs/nonEmptyPath"
      evaluator_profile:
        $ref: "#/$defs/nonEmptyPath"
      novel_truth_profile:
        $ref: "#/$defs/nonEmptyPath"
      metric_dictionary:
        $ref: "#/$defs/nonEmptyPath"
  execution:
    type: object
    additionalProperties: false
    required:
      - tracks
      - official_score_mode
      - use_conda
      - use_apptainer
      - keep_going
      - benchmark_repeats
      - cache_policy
      - random_seed
    properties:
      tracks:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/executionMode"
      official_score_mode:
        $ref: "#/$defs/executionMode"
      use_conda:
        type: boolean
      use_apptainer:
        type: boolean
      keep_going:
        type: boolean
      benchmark_repeats:
        type: integer
        minimum: 1
      cache_policy:
        const: isolated_empty_tool_cache
      random_seed:
        type: integer
        minimum: 0
        maximum: 4294967295
      tool_threads:
        type: integer
        minimum: 1
      tool_memory_mb:
        type: integer
        minimum: 512
      tool_timeout_seconds:
        type: integer
        minimum: 1
  development:
    type: object
    additionalProperties: false
    required:
      - synthetic_mode
      - canonical_fastq
      - population_vcf
      - truth_vcf
      - benchmark_bed
      - evaluator_fixture_dir
      - allow_missing_bam
    properties:
      synthetic_mode:
        type: boolean
        default: false
      canonical_fastq:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      population_vcf:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      truth_vcf:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      benchmark_bed:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      evaluator_fixture_dir:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      allow_missing_bam:
        type: boolean
        default: false
  caller_only:
    type: object
    additionalProperties: false
    required:
      - alignment_kind
      - alignment_group_id
      - shared_graph_alignments
    properties:
      alignment_kind:
        enum: [bam, cram, gaf, gam, other]
      alignment_group_id:
        $ref: "#/$defs/identifier"
      shared_bam:
        $ref: "#/$defs/nonEmptyPath"
      shared_graph_alignments:
        type: object
        additionalProperties:
          $ref: "#/$defs/nonEmptyPath"
  score:
    type: object
    additionalProperties: false
    required: [profile, final_score_name, produce_ranking]
    properties:
      profile:
        const: pgbench_consensus_v4
      final_score_name:
        const: PGBenchConsensusScore
      produce_ranking:
        const: false
  evaluation:
    type: object
    additionalProperties: false
    required:
      - evaluators
      - truth_vcf
      - benchmark_bed
      - commands
    properties:
      evaluators:
        type: array
        minItems: 3
        maxItems: 3
        uniqueItems: true
        prefixItems:
          - const: truvari
          - const: aardvark
          - const: vcfdist
      truth_vcf:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      benchmark_bed:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      commands:
        type: object
        additionalProperties: false
        required: [bcftools, tabix, truvari, aardvark, vcfdist]
        properties:
          bcftools:
            $ref: "#/$defs/command"
          tabix:
            $ref: "#/$defs/command"
          truvari:
            $ref: "#/$defs/command"
          aardvark:
            $ref: "#/$defs/command"
          vcfdist:
            $ref: "#/$defs/command"
  obsidian:
    type: object
    additionalProperties: false
    required:
      - enabled
      - vault_root
      - vault_root_env
      - project_relpath
      - canonical_note
      - binding_file
    properties:
      enabled:
        type: boolean
      vault_root:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      vault_root_env:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
      project_relpath:
        $ref: "#/$defs/nonEmptyPath"
      canonical_note:
        $ref: "#/$defs/nonEmptyPath"
      binding_file:
        $ref: "#/$defs/nonEmptyPath"
  tools:
    type: object
    additionalProperties: false
    required: [enabled, planned_tools]
    properties:
      enabled:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/identifier"
      planned_tools:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/identifier"
  external_plugins:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, manifest]
      properties:
        id:
          $ref: "#/$defs/identifier"
        manifest:
          $ref: "#/$defs/nonEmptyPath"

allOf:
  - if:
      properties:
        execution:
          properties:
            official_score_mode:
              const: caller_only_shared_alignment
          required: [official_score_mode]
      required: [execution]
    then:
      properties:
        execution:
          properties:
            tracks:
              contains:
                const: caller_only_shared_alignment
      required: [execution, caller_only]
  - if:
      properties:
        execution:
          properties:
            official_score_mode:
              const: end_to_end_from_reads
          required: [official_score_mode]
      required: [execution]
    then:
      properties:
        execution:
          properties:
            tracks:
              contains:
                const: end_to_end_from_reads
  - if:
      properties:
        execution:
          properties:
            tracks:
              contains:
                const: caller_only_shared_alignment
          required: [tracks]
      required: [execution]
    then:
      required: [caller_only]
  - if:
      properties:
        development:
          properties:
            synthetic_mode:
              const: false
          required: [synthetic_mode]
      required: [development]
    then:
      properties:
        development:
          properties:
            canonical_fastq:
              type: "null"
            population_vcf:
              type: "null"
            truth_vcf:
              type: "null"
            benchmark_bed:
              type: "null"
            evaluator_fixture_dir:
              type: "null"
            allow_missing_bam:
              const: false
        pangenome:
          properties:
            population_vcf:
              $ref: "#/$defs/nonEmptyPath"
        evaluation:
          properties:
            truth_vcf:
              $ref: "#/$defs/nonEmptyPath"
            benchmark_bed:
              $ref: "#/$defs/nonEmptyPath"
  - if:
      properties:
        development:
          properties:
            synthetic_mode:
              const: true
          required: [synthetic_mode]
      required: [development]
    then:
      properties:
        development:
          properties:
            canonical_fastq:
              $ref: "#/$defs/nonEmptyPath"
            population_vcf:
              $ref: "#/$defs/nonEmptyPath"
            truth_vcf:
              $ref: "#/$defs/nonEmptyPath"
            benchmark_bed:
              $ref: "#/$defs/nonEmptyPath"
  - if:
      properties:
        caller_only:
          properties:
            alignment_kind:
              const: bam
          required: [alignment_kind]
      required: [caller_only]
    then:
      properties:
        caller_only:
          required: [shared_bam]
  - if:
      properties:
        execution:
          properties:
            official_score_mode:
              const: caller_only_shared_alignment
          required: [official_score_mode]
      required: [execution]
    then:
      properties:
        sample:
          properties:
            bam:
              $ref: "#/$defs/nonEmptyPath"

$defs:
  identifier:
    type: string
    minLength: 1
    maxLength: 128
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
  nonEmptyPath:
    type: string
    minLength: 1
  executionMode:
    enum:
      - caller_only_shared_alignment
      - end_to_end_from_reads
  sha256OrNull:
    oneOf:
      - type: string
        pattern: "^[a-f0-9]{64}$"
      - type: "null"
  command:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
