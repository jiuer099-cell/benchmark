$schema: https://json-schema.org/draft/2020-12/schema
$id: https://pgbench.local/schemas/config.schema.yaml
title: PGBench main configuration
type: object
additionalProperties: false
required:
  - schema_version
  - project
  - sample
  - benchmark_contract
  - reference
  - pangenome
  - truth
  - catalogs
  - execution
  - score
  - tools
  - external_plugins
properties:
  schema_version:
    const: 1
  benchmark_contract:
    type: object
    additionalProperties: false
    required:
      - track
      - chromosomes
      - svtypes
      - minimum_sv_size
      - maximum_sv_size
      - biallelic_only
      - sequence_resolved_only
      - truth_absence_policy
      - coverage_levels
      - downsampling_seeds
      - source_coverage_x
      - target_family_exclusion
      - score_status
      - conclusion_scope
      - independent_samples_status
    properties:
      track:
        const: short_read_fixed_panel_genotyping
      chromosomes:
        type: array
        minItems: 22
        maxItems: 22
        uniqueItems: true
        items:
          pattern: '^chr([1-9]|1[0-9]|2[0-2])$'
      svtypes:
        const: [DEL, INS]
      minimum_sv_size:
        const: 50
      maximum_sv_size:
        const: 10000
      biallelic_only:
        const: true
      sequence_resolved_only:
        const: true
      truth_absence_policy:
        const: unscorable_without_explicit_reference_confidence
      coverage_levels:
        const: [10, 20, 30, full]
      downsampling_seeds:
        type: array
        minItems: 3
        uniqueItems: true
        items: {type: integer, minimum: 0}
      source_coverage_x:
        type: number
        minimum: 30
      target_family_exclusion:
        type: array
        minItems: 6
        uniqueItems: true
        allOf:
          - contains: {const: HG002}
          - contains: {const: NA24385}
          - contains: {const: HG003}
          - contains: {const: NA24149}
          - contains: {const: HG004}
          - contains: {const: NA24143}
        items:
          $ref: "#/$defs/identifier"
      score_status:
        enum: [experimental, valid]
      conclusion_scope:
        const: sample_and_configuration_specific
      independent_samples_status:
        enum: [not_available, complete]
  project:
    type: object
    additionalProperties: false
    required: [id, run_id]
    properties:
      id:
        $ref: "#/$defs/identifier"
      run_id:
        $ref: "#/$defs/identifier"
  sample:
    type: object
    additionalProperties: false
    required:
      - id
      - sex
      - technology
      - library_id
      - source_evidence_id
      - coverage_x
      - read_count
      - read_bases
      - downsampling_seed
      - fastq_r1
      - fastq_r2
    properties:
      id:
        $ref: "#/$defs/identifier"
      sex:
        enum: [male, female, unknown]
      technology:
        const: illumina_short_read
      library_id:
        $ref: "#/$defs/identifier"
      source_evidence_id:
        $ref: "#/$defs/identifier"
      coverage_x:
        oneOf:
          - type: number
            exclusiveMinimum: 0
          - type: "null"
      read_count:
        oneOf:
          - type: integer
            minimum: 1
          - type: "null"
      read_bases:
        oneOf:
          - type: integer
            minimum: 1
          - type: "null"
      downsampling_seed:
        oneOf:
          - type: integer
            minimum: 0
          - type: "null"
      fastq_r1:
        $ref: "#/$defs/nonEmptyPath"
      fastq_r2:
        $ref: "#/$defs/nonEmptyPath"
      allow_sample_name_override:
        type: boolean
        default: false
  reference:
    type: object
    additionalProperties: false
    required: [id, fasta]
    properties:
      id:
        const: grch38
      fasta:
        $ref: "#/$defs/nonEmptyPath"
      fai:
        $ref: "#/$defs/nonEmptyPath"
      dict:
        $ref: "#/$defs/nonEmptyPath"
      sha256:
        $ref: "#/$defs/sha256OrNull"
  pangenome:
    type: object
    additionalProperties: false
    required:
      - id
      - backbone
      - population_panel
      - truth_leakage_policy
      - build_graph_assets
      - allele_namespace
      - population_vcf
      - graph_assets
      - excluded_samples
    properties:
      id:
        $ref: "#/$defs/identifier"
      backbone:
        const: grch38
      population_panel:
        $ref: "#/$defs/identifier"
      truth_leakage_policy:
        const: exclude_hg002_truth
      build_graph_assets:
        type: boolean
      allele_namespace:
        const: PGSV
      excluded_samples:
        type: array
        minItems: 1
        uniqueItems: true
        contains:
          const: HG002
        items:
          $ref: "#/$defs/identifier"
      manifest:
        $ref: "#/$defs/nonEmptyPath"
      population_vcf:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      graph_assets:
        type: object
        additionalProperties: false
        required:
          - profile
          - manifest
          - gbz
          - xg
          - min
          - dist
          - sample_list
          - reference_path
        properties:
          profile:
            enum:
              - none
              - vg_gbz_min_dist
              - vg_giraffe_shortread
          manifest:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          gbz:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          gfa:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          variation_calls:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          xg:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          min:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          zipcodes:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          dist:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          sample_list:
            oneOf:
              - $ref: "#/$defs/nonEmptyPath"
              - type: "null"
          reference_path:
            type: string
            minLength: 1
  truth:
    type: object
    additionalProperties: false
    required: [primary, secondary]
    properties:
      primary:
        $ref: "#/$defs/identifier"
      secondary:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/identifier"
  catalogs:
    type: object
    additionalProperties: false
    required:
      - truthsets
      - stratifications
      - score_weights
      - evaluator_profile
      - metric_dictionary
      - allowed_information
      - tuning_policy
      - panel_provenance
    properties:
      truthsets:
        $ref: "#/$defs/nonEmptyPath"
      stratifications:
        $ref: "#/$defs/nonEmptyPath"
      score_weights:
        $ref: "#/$defs/nonEmptyPath"
      evaluator_profile:
        $ref: "#/$defs/nonEmptyPath"
      metric_dictionary:
        $ref: "#/$defs/nonEmptyPath"
      allowed_information:
        $ref: "#/$defs/nonEmptyPath"
      tuning_policy:
        $ref: "#/$defs/nonEmptyPath"
      panel_provenance:
        $ref: "#/$defs/nonEmptyPath"
  execution:
    type: object
    additionalProperties: false
    required:
      - tracks
      - official_score_mode
      - use_conda
      - use_apptainer
      - keep_going
      - benchmark_repeats
      - cache_policy
      - random_seed
    properties:
      tracks:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/executionMode"
      official_score_mode:
        $ref: "#/$defs/executionMode"
      use_conda:
        type: boolean
      use_apptainer:
        type: boolean
      keep_going:
        type: boolean
      benchmark_repeats:
        type: integer
        minimum: 1
      cache_policy:
        const: isolated_empty_tool_cache
      random_seed:
        type: integer
        minimum: 0
        maximum: 4294967295
      tool_threads:
        type: integer
        minimum: 1
      tool_memory_mb:
        type: integer
        minimum: 512
      tool_timeout_seconds:
        type: integer
        minimum: 1
  development:
    type: object
    additionalProperties: false
    required:
      - synthetic_mode
      - population_vcf
      - truth_vcf
      - benchmark_bed
      - evaluator_fixture_dir
    properties:
      synthetic_mode:
        type: boolean
        default: false
      population_vcf:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      truth_vcf:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      benchmark_bed:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      evaluator_fixture_dir:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
  score:
    type: object
    additionalProperties: false
    required: [profile, final_score_name, produce_ranking]
    properties:
      profile:
        const: pgbench_me_f1_v1
      final_score_name:
        const: ME-F1
      produce_ranking:
        const: true
  evaluation:
    type: object
    additionalProperties: false
    required:
      - evaluators
      - truth_vcf
      - benchmark_bed
      - context_beds
      - commands
    properties:
      evaluators:
        type: array
        minItems: 3
        maxItems: 3
        uniqueItems: true
        prefixItems:
          - const: truvari
          - const: aardvark
          - const: vcfdist
      truth_vcf:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      benchmark_bed:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      context_beds:
        type: object
        additionalProperties: false
        required:
          - non_repeat
          - tandem_repeat
          - segmental_duplication
          - low_complexity
          - low_mappability
          - other_difficult
        properties:
          non_repeat: {$ref: "#/$defs/nonEmptyPath"}
          tandem_repeat: {$ref: "#/$defs/nonEmptyPath"}
          segmental_duplication: {$ref: "#/$defs/nonEmptyPath"}
          low_complexity: {$ref: "#/$defs/nonEmptyPath"}
          low_mappability: {$ref: "#/$defs/nonEmptyPath"}
          other_difficult: {$ref: "#/$defs/nonEmptyPath"}
      commands:
        type: object
        additionalProperties: false
        required: [bcftools, tabix, truvari, aardvark, vcfdist]
        properties:
          bcftools:
            $ref: "#/$defs/command"
          tabix:
            $ref: "#/$defs/command"
          truvari:
            $ref: "#/$defs/command"
          aardvark:
            $ref: "#/$defs/command"
          vcfdist:
            $ref: "#/$defs/command"
  obsidian:
    type: object
    additionalProperties: false
    required:
      - enabled
      - vault_root
      - vault_root_env
      - project_relpath
      - canonical_note
      - binding_file
    properties:
      enabled:
        type: boolean
      vault_root:
        oneOf:
          - $ref: "#/$defs/nonEmptyPath"
          - type: "null"
      vault_root_env:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
      project_relpath:
        $ref: "#/$defs/nonEmptyPath"
      canonical_note:
        $ref: "#/$defs/nonEmptyPath"
      binding_file:
        $ref: "#/$defs/nonEmptyPath"
  tools:
    type: object
    additionalProperties: false
    required: [enabled, planned_tools]
    properties:
      enabled:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/identifier"
      planned_tools:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/identifier"
  external_plugins:
    type: array
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [id, manifest]
      properties:
        id:
          $ref: "#/$defs/identifier"
        manifest:
          $ref: "#/$defs/nonEmptyPath"
        tool_index:
          $ref: "#/$defs/nonEmptyPath"

allOf:
  - if:
      properties:
        execution:
          properties:
            official_score_mode:
              const: end_to_end_from_reads
          required: [official_score_mode]
      required: [execution]
    then:
      properties:
        execution:
          properties:
            tracks:
              contains:
                const: end_to_end_from_reads
  - if:
      properties:
        development:
          properties:
            synthetic_mode:
              const: false
          required: [synthetic_mode]
      required: [development]
    then:
      properties:
        development:
          properties:
            population_vcf:
              type: "null"
            truth_vcf:
              type: "null"
            benchmark_bed:
              type: "null"
            evaluator_fixture_dir:
              type: "null"
        pangenome:
          properties:
            population_vcf:
              $ref: "#/$defs/nonEmptyPath"
        evaluation:
          properties:
            truth_vcf:
              $ref: "#/$defs/nonEmptyPath"
            benchmark_bed:
              $ref: "#/$defs/nonEmptyPath"
  - if:
      properties:
        development:
          properties:
            synthetic_mode:
              const: true
          required: [synthetic_mode]
      required: [development]
    then:
      properties:
        development:
          properties:
            population_vcf:
              $ref: "#/$defs/nonEmptyPath"
            truth_vcf:
              $ref: "#/$defs/nonEmptyPath"
            benchmark_bed:
              $ref: "#/$defs/nonEmptyPath"

$defs:
  identifier:
    type: string
    minLength: 1
    maxLength: 128
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
  nonEmptyPath:
    type: string
    minLength: 1
  executionMode:
    const: end_to_end_from_reads
  sha256OrNull:
    oneOf:
      - type: string
        pattern: "^[a-f0-9]{64}$"
      - type: "null"
  command:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
