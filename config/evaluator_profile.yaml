schema_version: 1

profile:
  id: pgbench_evaluators_grch38_gt_v1
  score_semantics_version: "1.0"
  description: Frozen, common genotype-aware evaluator contract for short-read fixed-panel SV genotyping.

semantic_validation:
  contract: pgbench_genotype_evaluator_contract_v1
  status: enforced_by_runtime_artifact
  suite: tests/fixtures/evaluator_semantics/cases.yaml
  required_cases:
    - exact_het
    - het_to_hom_alt_mismatch
    - hom_alt_to_het_mismatch
    - truth_alt_query_hom_ref
    - truth_hom_ref_query_alt
    - equivalent_representation
    - explicit_no_call
    - nearby_biologically_distinct
  genotype_mismatch_policy: one_false_positive_plus_one_false_negative
  no_call_policy: false_negative_for_truth_positive
  unsupported_truth_positive_policy: false_negative
  unscorable_policy: tool_independent_pre_adapter_exclusion
  summary_policy: recompute_tp_fp_fn_from_detailed_ledger

universe:
  truth_filter_policy: pass_only
  query_filter_policy: pass_or_unfiltered
  minimum_sv_size: 50
  maximum_sv_size: 10000
  allowed_svtypes: [DEL, INS]
  biallelic_only: true
  multiallelic_policy: exclude
  region_policy: fully_contained

sv_match:
  require_same_svtype: true
  max_breakpoint_distance: 500
  min_size_similarity: 0.70
  min_sequence_similarity: 0.70
  sequence_similarity_algorithm: truvari_v5.4.0_best_seqsim_edlib_1.3.9.post1
  sequence_roll_policy: enabled
  sequence_required_for_resolved_insertions: true
  one_to_one: true

semantics:
  primary_vote: detection
  # Formal ME-F1 is invalid when representation mapping leaves more than one
  # percent of submitted events unresolved.
  maximum_unresolved_mapping_fraction: 0.01
  # vcfdist standardizes all query variants in one supercluster and does not
  # retain submitted IDs. A bulk run may therefore emit fewer query rows than
  # source events. Every bulk-unresolved source event is rerun in a one-event
  # VCF; its native rows can then belong to exactly that one source event. The
  # common global one-to-one truth assignment remains the only TP authority.
  vcfdist_unresolved_recovery:
    enabled: true
    contract: isolated_single_query_event_v1
    selection: every_bulk_unresolved_submitted_event
    aggregation: mean_all_native_query_credits
  genotype:
    require_exact: true
    require_phase: false
  no_call_is_incorrect: true

evaluators:
  truvari:
    # Truvari is a subcommand CLI; a top-level --version is rejected by
    # supported 4.x releases. The frozen bench help text is used as the
    # executable/interface fingerprint and is compared across formal runs.
    version_args: [bench, --help]
    expected_version_sha256: 6587f29d09e453ae50a398c79804f127a615e76563f4c179ff7ae45fe750fad4
    extra_args:
      - --refdist
      - "500"
      - --pctsize
      - "0.70"
      - --pctseq
      - "0.70"
      - --sizemax
      - "10000"
  aardvark:
    version_args: [--version]
    expected_version_sha256: fb6fda42c6d7b8f3baabdf027e9bde95a0114798673f84e676b1eff9b4c5c2ac
    # Pacific Biosciences recommends a wider clustering gap for SV comparison.
    extra_args: [--min-variant-gap, "1000"]
  vcfdist:
    version_args: [--version]
    expected_version_sha256: 714eb9f5def97655ca3cd6704c2f5dc146604b2066f872e8f0a81d1239978c53
    # vcfdist 2.x names the filter --largest-variant. For SV workloads its
    # own documentation recommends size clustering; the supercluster ceiling
    # is kept above the frozen 10 kb event envelope.
    extra_args:
      - --largest-variant
      - "10000"
      - --cluster
      - size
      - "100"
      - --max-supercluster-size
      - "20000"
    credit_threshold: 0.70

bootstrap:
  replicates: 1000
  confidence_level: 0.95
  unit: fixed_genomic_block
  method: paired_genomic_block_bootstrap
  block_size_bp: 10000000
