schema_version: 1

profile:
  id: pgbench_v1
  final_score_name: PGBenchScore
  score_min: 0.0
  score_max: 100.0
  display_decimals: 2
  default_official_mode: end_to_end_from_reads
  produce_ranking: false
  bootstrap_seed: 20260716
  bootstrap_unit: truth_variant_cluster
  confidence_level: 0.95

layers:
  evaluator_accuracy:
    max_points: 70.0
    missing_tool_capability_policy: zero_points_no_reweighting
    infrastructure_failure_policy: invalid_score
    evaluators:
      truvari:
        fusion_weight: 0.40
        max_points: 28.0
        components:
          overall_event_f1:
            metric: truvari.event.overall.f1
            max_points: 10.0
          svtype_macro_f1:
            metric: truvari.event.svtype.macro_f1
            max_points: 3.0
          length_macro_f1:
            metric: truvari.event.length.macro_f1
            max_points: 3.0
          exact_gt_concordance:
            metric: truvari.gt.exact_concordance
            max_points: 5.0
          fidelity:
            metric: truvari.match.mean_similarity
            max_points: 4.0
            formula:
              sequence_similarity: 0.35
              size_similarity: 0.25
              start_accuracy: 0.20
              end_accuracy: 0.20
          difficult_context_f1:
            metric: truvari.context.difficult.macro_f1
            max_points: 3.0

      aardvark:
        fusion_weight: 0.35
        max_points: 24.5
        components:
          exact_haplotype_f1:
            metric: aardvark.haplotype.exact_f1
            max_points: 8.0
          partial_credit_f1:
            metric: aardvark.haplotype.partial_f1
            max_points: 6.0
          exact_gt_concordance:
            metric: aardvark.gt.exact_concordance
            max_points: 4.0
          complex_cluster_f1:
            metric: aardvark.complex.exact_f1
            max_points: 4.0
          allele_sequence_fidelity:
            metric: aardvark.haplotype.sequence_similarity
            max_points: 2.5

      vcfdist:
        fusion_weight: 0.25
        max_points: 17.5
        components:
          representation_f1:
            metric: vcfdist.representation.f1
            max_points: 7.0
          gt_concordance:
            metric: vcfdist.gt.exact_concordance
            max_points: 3.5
          phase_accuracy:
            metric: vcfdist.phase.accuracy
            max_points: 3.0
          complex_consistency:
            metric: vcfdist.complex.consistency
            max_points: 2.0
          eligible_coverage:
            metric: vcfdist.eligible.coverage
            max_points: 2.0

  pangenome_robustness:
    max_points: 15.0
    evaluator_fusion_weights:
      truvari: 0.40
      aardvark: 0.35
      vcfdist: 0.25
    components:
      in_panel_gt_macro_f1:
        metric: pangenome.in_panel.gt.fused_macro_f1
        max_points: 4.0
      allele_link_precision:
        metric: pangenome.link.precision
        max_points: 2.0
      allele_link_coverage:
        metric: pangenome.link.coverage
        max_points: 2.0
      population_af_macro_f1:
        metric: pangenome.af.fused_macro_f1
        max_points: 2.0
      graph_complexity_macro_f1:
        metric: pangenome.graph.fused_macro_f1
        max_points: 1.0
      difficult_context_macro_f1:
        metric: pangenome.context.fused_macro_f1
        max_points: 2.0
      out_of_panel_truth_f1:
        metric: pangenome.novel.fused_f1
        max_points: 2.0

  resource_efficiency:
    max_points: 10.0
    interpolation: natural_log_between_target_and_limit
    aggregation:
      repeats: median_of_successful_repeats
      any_failed_official_repeat: runtime_failed
      wall_time: earliest_billable_start_to_latest_billable_finish
      peak_rss: maximum_sum_of_billable_process_rss
      disk_peak: maximum_tool_scoped_increment
      cpu_hours: sum_user_and_system_cpu_seconds_divided_by_3600
    components:
      wall_time_hours:
        metric: resource.wall_time.hours
        max_points: 4.0
      peak_rss_gib:
        metric: resource.peak_rss.gib
        max_points: 3.0
      disk_peak_gib:
        metric: resource.disk_peak.gib
        max_points: 2.0
      cpu_hours:
        metric: resource.cpu.hours
        max_points: 1.0
    budgets:
      end_to_end_from_reads:
        wall_time_hours:
          target: 12.0
          limit: 72.0
        peak_rss_gib:
          target: 64.0
          limit: 512.0
        disk_peak_gib:
          target: 250.0
          limit: 2048.0
        cpu_hours:
          target: 96.0
          limit: 2000.0
      caller_only_shared_alignment:
        wall_time_hours:
          target: 4.0
          limit: 24.0
        peak_rss_gib:
          target: 64.0
          limit: 256.0
        disk_peak_gib:
          target: 100.0
          limit: 500.0
        cpu_hours:
          target: 32.0
          limit: 512.0

  traceability:
    max_points: 5.0
    components:
      manifest_completeness:
        metric: traceability.manifest_completeness
        max_points: 2.0
        scoring: proportional
      hash_lineage_complete:
        metric: traceability.hash_lineage.complete
        max_points: 1.0
        scoring: binary
      environment_complete:
        metric: traceability.environment.complete
        max_points: 1.0
        scoring: binary
      run_context_complete:
        metric: traceability.run_context.complete
        max_points: 1.0
        scoring: binary

required_f1_metrics:
  - truvari.event.overall.f1
  - truvari.event.svtype.macro_f1
  - truvari.event.length.macro_f1
  - aardvark.haplotype.exact_f1
  - aardvark.haplotype.partial_f1
  - vcfdist.representation.f1
  - pangenome.in_panel.gt.fused_macro_f1
  - pangenome.af.fused_macro_f1
  - pangenome.graph.fused_macro_f1
  - pangenome.context.fused_macro_f1
  - pangenome.novel.fused_f1

status_policy:
  valid:
    description: Default evaluators completed or legally emitted tool-ineligible zeros, and core provenance is complete.
  provisional:
    description: Metrics are computable but non-core provenance is incomplete.
  invalid:
    description: Evaluator infrastructure, truth/reference, parser schema, or core lineage failed.
  no_numeric_score:
    - not_applicable
    - runtime_failed
    - invalid_output
    - incompatible_output
    - provenance_failed
    - mode_contract_violation

formula:
  total: evaluator_accuracy + pangenome_robustness + resource_efficiency + traceability
  evaluator_equivalence: 0.70 * (0.40 * TruvariScore + 0.35 * AardvarkScore + 0.25 * VcfdistScore)
  resource_fraction: (ln(limit) - ln(value)) / (ln(limit) - ln(target))
