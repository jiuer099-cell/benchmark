schema_version: 1
profile_id: giab_grch38_v3_6
reference_id: grch38
release: v3.6
source_reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC11489684/
local_root: resources/stratifications/giab_grch38_v3_6

# Asset paths are resolved and checksummed by prepare_stratifications. Logical
# IDs remain stable even when GIAB changes archive layout.
strata:
  easy:
    asset_id: giab_easy
    category: difficulty
    required_for_score: false
  difficult:
    asset_id: giab_all_difficult
    category: difficulty
    required_for_score: true
  segmental_duplication:
    asset_id: giab_segmental_duplications
    category: repeat
    required_for_score: true
  tandem_repeat:
    asset_id: giab_tandem_repeats
    category: repeat
    required_for_score: true
  homopolymer:
    asset_id: giab_homopolymers
    category: repeat
    required_for_score: true
  low_complexity:
    asset_id: giab_low_complexity
    category: sequence_context
    required_for_score: true
  low_mappability:
    asset_id: giab_low_mappability
    category: mappability
    required_for_score: true
  gc_extreme:
    asset_id: giab_gc_extremes
    category: sequence_context
    required_for_score: true
  coding_exonic:
    asset_id: grch38_coding_exonic
    category: functional
    required_for_score: true
  medically_relevant:
    asset_id: giab_medically_relevant
    category: functional
    required_for_score: true
  autosomes:
    asset_id: grch38_autosomes
    category: chromosome
    required_for_score: false

score_universes:
  difficult_context_v1:
    macro_f1_strata:
      - difficult
      - segmental_duplication
      - tandem_repeat
      - homopolymer
      - low_complexity
      - low_mappability
      - gc_extreme
      - coding_exonic
      - medically_relevant
    zero_truth_policy: pre_run_exclude_for_all_tools

  graph_complexity_v1:
    classes:
      - simple_biallelic
      - multiallelic
      - nested_or_overlapping
      - repeat_ambiguous
    class_priority:
      - repeat_ambiguous
      - nested_or_overlapping
      - multiallelic
      - simple_biallelic

  population_af_v1:
    bins:
      ultrarare:
        lower_exclusive: 0.0
        upper_exclusive: 0.001
      rare:
        lower_inclusive: 0.001
        upper_exclusive: 0.01
      low_frequency:
        lower_inclusive: 0.01
        upper_exclusive: 0.05
      common:
        lower_inclusive: 0.05
        upper_inclusive: 1.0
