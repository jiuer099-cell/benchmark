interface_version: 1
id: pangenie
name: PanGenie short-read pangenome genotyper
version: 4.2.1
source: builtin
paradigm: short_read_pangenome_genotyping
comparison_task: panel_genotyping

information_inputs:
  - target_short_reads
  - reference_grch38
  - canonical_candidate_panel
  - benchmark_panel_haplotypes
  - benchmark_panel_af_ac

information_contract:
  allowed_inputs_manifested: true
  target_truth_used_for_calling: false
  target_assembly_used: false
  target_family_genotypes_used: false
  target_specific_external_callset: false
  tuning_mode: official_recommended_sv_config
  parameter_source: official_documentation

tasks: [prepare_assets, index, genotyping, postprocess]

inputs:
  reference: required
  candidates: required
  pangenome_manifest: required
  pangenome_panel: required
  graph_assets:
    required: false
    accepted_formats: [gbz, xg_gbwt]
    accepted_profiles: []

capabilities:
  technology: [illumina_short_read]
  svtypes: [DEL, INS]
  phasing: false
  novel_discovery: false
  allele_linkage_output: benchmark_inferred
  allele_namespace: [PGSV]

execution:
  runner: run.py
  environment: envs/environment.yaml
  rule_registry: rule-registry.yaml
  trust_level: trusted_reviewed
  sandbox_backend: bwrap

supported_modes:
  end_to_end_from_reads:
    required_inputs:
      - short_fastq_r1
      - short_fastq_r2
      - reference
      - pangenome_manifest
      - pangenome_panel
      - candidate_panel
    optional_inputs: []
    billable_stages:
      - prepare_assets
      - index
      - genotype
      - postprocess

outputs:
  vcf: raw/calls.vcf
  candidate_output_contract: all_sites
  absence_semantics: no_call
