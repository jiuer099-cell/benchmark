schema_version: 1
rules:
  - id: tool__kanpig__genotype
    description: Genotype the blinded pangenome SV panel with KanPIG.
    phase: tool_execution
    kind: plugin
    inputs:
      - blinded_candidate_vcf
      - shared_linear_bam
      - grch38_reference
    outputs:
      - raw_all_sites_vcf
    upstream:
      - build_blinded_challenge_panel
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: implemented
    source_path: plugins/kanpig/run.py
    environment: plugins/kanpig/envs/environment.yaml
    resource_class: tool_default
    active_when:
      tool: kanpig
      task: genotyping
