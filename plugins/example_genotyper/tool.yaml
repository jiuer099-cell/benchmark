interface_version: 1
id: example_genotyper
name: Deterministic PGBench example genotyper
version: 0.1.0
source: external
paradigm: genotyping_only
comparison_task: panel_genotyping

information_contract:
  allowed_inputs_manifested: true
  target_truth_used_for_calling: false
  target_assembly_used: false
  target_family_genotypes_used: false
  target_specific_external_callset: false
  tuning_status: official_configuration

tasks:
  - genotyping
  - postprocess

inputs:
  reference: required
  candidates: required
  pangenome_manifest: required
  pangenome_panel: required
  graph_assets:
    required: false
    accepted_formats:
      - gbz
      - xg_gbwt
    accepted_profiles:
      - vg_gbz_min_dist

capabilities:
  technology: [illumina_short_read]
  svtypes:
    - DEL
    - INS
  phasing: false
  novel_discovery: false
  allele_linkage_output: benchmark_inferred
  allele_namespace:
    - PGSV

execution:
  runner: run.py
  environment: envs/environment.yaml
  rule_registry: rule-registry.yaml
  trust_level: untrusted
  # Development example only. Formal execution refuses this backend.
  sandbox_backend: none

supported_modes:
  end_to_end_from_reads:
    required_inputs:
      - short_fastq_r1
      - short_fastq_r2
      - reference
      - pangenome_manifest
      - pangenome_panel
      - candidate_panel
    optional_inputs: []
    billable_stages:
      - genotype
      - postprocess

outputs:
  vcf: raw/calls.vcf.gz
  candidate_output_contract: all_sites
  absence_semantics: no_call
