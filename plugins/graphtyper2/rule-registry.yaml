schema_version: 1
rules:
  - id: tool__graphtyper2__map
    description: Map the registered paired Illumina reads to the frozen GRCh38 reference.
    phase: tool_execution
    kind: plugin
    inputs: [short_fastq_r1, short_fastq_r2, grch38_reference]
    outputs: [coordinate_sorted_bam, bam_index]
    upstream: [build_pangenome_manifest]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: implemented
    source_path: plugins/graphtyper2/run.py
    environment: plugins/graphtyper2/envs/environment.yaml
    resource_class: tool_large
    active_when: {tool: graphtyper2, task: mapping}
  - id: tool__graphtyper2__genotype
    description: Genotype the frozen blinded pangenome SV panel with GraphTyper2.
    phase: tool_execution
    kind: plugin
    inputs: [coordinate_sorted_bam, blinded_candidate_panel]
    outputs: [raw_all_sites_vcf]
    upstream: [tool__graphtyper2__map]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: implemented
    source_path: plugins/graphtyper2/run.py
    environment: plugins/graphtyper2/envs/environment.yaml
    resource_class: tool_large
    active_when: {tool: graphtyper2, task: genotyping}
