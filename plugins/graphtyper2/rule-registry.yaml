schema_version: 1
rules:
  - id: graphtyper2
    description: Genotype deterministic disjoint shards of the frozen blinded pangenome SV panel with GraphTyper2.
    phase: tool_execution
    kind: plugin
    inputs: [shared_shortread_alignment, shared_shortread_alignment_index, reference, reference_index, candidate_panel]
    outputs: [raw_all_sites_vcf]
    upstream: ["tool__{tool}__execute"]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: run.py
    environment: envs/environment.yaml
    resource_class: compute_large
