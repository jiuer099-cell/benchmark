schema_version: 1
rules:
  - id: paragraph
    description: Run Paragraph from the frozen shared BAM/BAI on the canonical panel and retain all candidates.
    phase: tool_execution
    kind: plugin
    inputs: [shared_shortread_alignment, shared_shortread_alignment_index, reference, candidate_panel]
    outputs: [raw_tool_vcf]
    upstream: ["tool__{tool}__execute"]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: run.py
    environment: envs/environment.yaml
    resource_class: compute_large
