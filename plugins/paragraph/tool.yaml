interface_version: 2
id: paragraph
name: Paragraph short-read graph genotyper
version: "2.3"
source: external
paradigm: genotyping_only
comparison_task: panel_genotyping
information_inputs:
  - reference_grch38
  - canonical_candidate_panel
  - benchmark_supplied_shared_alignment
information_contract:
  allowed_inputs_manifested: true
  target_truth_used_for_calling: false
  target_assembly_used: false
  target_family_genotypes_used: false
  target_specific_external_callset: false
  tuning_mode: official_recommended_sv_config
  parameter_source: official_documentation
tasks: [prepare_assets, genotyping, postprocess]
inputs:
  reference: required
  candidates: required
  pangenome_manifest: forbidden
  pangenome_panel: forbidden
  graph_assets:
    required: false
    accepted_formats: []
    accepted_profiles: []
capabilities:
  read_class: short
  technology: [illumina_pe]
  svtypes: [DEL, INS]
  phasing: false
  novel_discovery: false
  allele_linkage_output: benchmark_inferred
  allele_namespace: [PGSV]

native_assets:
  uses_population_or_pangenome_information: false
  frozen_haplotype_source_bundle: null
execution:
  runner: run.py
  environment: envs/environment.yaml
  rule_registry: rule-registry.yaml
  trust_level: untrusted
  sandbox_backend: bwrap
supported_modes:
  end_to_end_from_reads:
    required_inputs:
      - shared_shortread_alignment
      - shared_shortread_alignment_index
      - reference
      - candidate_panel
    # These two assets are supplied only for a formal scoring replay of an
    # already frozen Paragraph all-sites VCF.  They make the adapter
    # authenticate and reproject its own output; no caller is re-run.
    optional_inputs:
      - reference_index
      - adapter_asset.frozen_native_vcf
      - adapter_asset.frozen_native_tool_manifest
    billable_stages: [prepare_assets, genotype, postprocess]
outputs:
  # Paragraph projects its canonical all-sites ledger as plain VCF. This keeps
  # the external-adapter transport independent of optional BGZF/index tooling;
  # Core owns any downstream evaluator-specific conversion.
  vcf: raw/calls.vcf
  candidate_output_contract: all_sites
  absence_semantics: no_call
