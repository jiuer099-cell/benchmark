interface_version: 1
id: vg
name: vg Giraffe short-read pangenome SV calling
version: "2"
source: external
paradigm: graph_pangenome
comparison_task: wg_discovery

tasks: [mapping, calling, postprocess]

inputs:
  reads: paired_short_fastq
  reference: required
  candidates: optional
  pangenome_manifest: required
  pangenome_panel: required
  graph_assets:
    required: true
    accepted_formats: [vg, xg_gbwt]
    accepted_profiles: [vg_giraffe_shortread]
  shared_alignment:
    required: false
    accepted_formats: [gam, gaf]
  read_sequences_auxiliary: false

capabilities:
  technology: [illumina_short_read]
  svtypes: [DEL, INS, DUP, INV, CNV, BND, CPX]
  phasing: false
  novel_discovery: false
  allele_linkage_output: benchmark_inferred
  allele_namespace: [PGSV]

execution:
  runner: run.py
  environment: envs/environment.yaml
  rule_registry: rule-registry.yaml
  trust_level: trusted_reviewed
  sandbox_backend: bwrap

supported_modes:
  end_to_end_from_reads:
    required_inputs:
      - short_fastq_r1
      - short_fastq_r2
      - reference
      - pangenome_manifest
      - pangenome_panel
      - graph_assets
    optional_inputs:
      - candidate_panel
    forbidden_inputs:
      - original_input_bam
      - shared_alignment
      - haplotype_fastq
      - canonical_fastq
    billable_stages:
      - map
      - call
      - postprocess

outputs:
  vcf: raw/calls.vcf
  candidate_output_contract: variant_sites
  # vg emits detected graph sites, not a callable all-sites gVCF. Absence is
  # therefore a no-call, not evidence for a homozygous-reference genotype.
  absence_semantics: no_call
