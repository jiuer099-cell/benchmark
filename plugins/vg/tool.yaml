interface_version: 1
id: vg
name: vg Giraffe short-read pangenome SV calling
version: "2"
source: builtin
paradigm: graph_pangenome
comparison_task: panel_genotyping

information_contract:
  allowed_inputs_manifested: true
  target_truth_used_for_calling: false
  target_assembly_used: false
  target_family_genotypes_used: false
  target_specific_external_callset: false
  tuning_status: official_configuration

tasks: [mapping, calling, postprocess]

inputs:
  reference: required
  candidates: required
  pangenome_manifest: required
  pangenome_panel: required
  graph_assets:
    required: true
    accepted_formats: [gbz, xg_gbwt]
    accepted_profiles: [vg_giraffe_shortread]

capabilities:
  technology: [illumina_short_read]
  svtypes: [DEL, INS]
  phasing: false
  novel_discovery: false
  allele_linkage_output: benchmark_inferred
  allele_namespace: [PGSV]

execution:
  runner: run.py
  environment: envs/environment.yaml
  rule_registry: rule-registry.yaml
  trust_level: trusted_reviewed
  sandbox_backend: bwrap

supported_modes:
  end_to_end_from_reads:
    required_inputs:
      - short_fastq_r1
      - short_fastq_r2
      - reference
      - pangenome_manifest
      - pangenome_panel
      - graph_assets
      - candidate_panel
    optional_inputs: []
    billable_stages:
      - map
      - call
      - postprocess

outputs:
  vcf: raw/calls.vcf
  candidate_output_contract: all_sites
  # The adapter projects vg's native calls onto every frozen
  # canonical candidate. Missing native calls remain explicit ./., never 0/0.
  absence_semantics: no_call
