interface_version: 1
id: svarp
name: SVarp external long-read pangenome SV discovery
version: 1.2.0
source: external
paradigm: discovery_integration
comparison_task: novel_pangenome_discovery

tasks: [prepare_assets, mapping, discovery, assembly, postprocess]

inputs:
  reads: long_fastq
  reference: required
  candidates: optional
  pangenome_manifest: required
  pangenome_panel: optional
  graph_assets:
    required: true
    accepted_formats: [gfa]
    accepted_profiles: [svarp_minigraph_longread]
  shared_alignment:
    required: false
    accepted_formats: [gaf]
  read_sequences_auxiliary: false

capabilities:
  technology: [pacbio_clr]
  svtypes: [DEL, INS]
  phasing: false
  novel_discovery: true
  allele_linkage_output: none
  allele_namespace: [SVARP]

execution:
  runner: run.py
  environment: envs/environment.yaml
  rule_registry: rule-registry.yaml
  trust_level: untrusted
  sandbox_backend: bwrap

parameter_contract:
  contract: pgbench_tool_parameters_v1
  source_release:
    tag: v1.2.0
    commit: 9fc34f848bd6506b4fbe6283e44c55b0a691519d
    source_url: https://github.com/asylvz/SVarp/archive/refs/tags/v1.2.0.tar.gz
    archive_sha256: 17203cbd36a138dec8b4fae9b3afdc7fef45f3289661d0ad1336e81886163f50
  explicit:
    assembler: wtdbg2
    support: 5
    dist_threshold: 100
    min_alignment_score: 5000
    min_precise_clipping: 0.97
    min_map_ratio: 0.90
    threads: PGBENCH_THREADS
  implicit:
    phase_tags: null
    skip_untagged: false
    no_remap: false
    assembly_mode: false
    debug: false
    read_type_option: unsupported_in_v1.2.0

supported_modes:
  end_to_end_from_reads:
    required_inputs:
      - canonical_fastq
      - reference
      - reference_index
      - pangenome_manifest
      - graph_assets
    optional_inputs:
      - pangenome_panel
      - candidate_panel
    forbidden_inputs:
      - short_fastq_r1
      - short_fastq_r2
      - haplotype_fastq
      - original_input_bam
      - shared_alignment
    billable_stages:
      - prepare_assets
      - map
      - discover
      - assemble
      - postprocess

outputs:
  vcf: raw/calls.vcf
  # SVarp discovers new allele sequences rather than genotyping a fixed panel.
  # A record's presence is therefore the detection assertion; GT stays no-call.
  candidate_output_contract: variant_sites
  absence_semantics: no_call
