channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  # The isolated tool wrapper validates the tool manifest before executing
  # SVarp, so these are runtime dependencies of this environment as well.
  - pyyaml>=6,<7
  - jsonschema>=4.23,<5
  - svarp=1.2.0
  - graphaligner=1.0.20
  - minigraph=0.21
  - minimap2=2.31
  - seqtk=1.5
  # Supplies the wtdbg2 and wtpoa-cns executables invoked by SVarp.
  - wtdbg=2.5
  - samtools=1.23
  - htslib=1.23
  - k8=1.2
