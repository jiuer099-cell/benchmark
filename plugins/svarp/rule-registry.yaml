schema_version: 1
rules:
  - id: tool__svarp__prepare_reads
    description: Convert the registered PacBio CLR FASTQ to an indexed bgzip FASTA inside the isolated attempt directory.
    phase: tool_execution
    kind: plugin
    inputs: [canonical_long_fastq]
    outputs: [bgzip_long_read_fasta]
    upstream: [build_pangenome_manifest]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: implemented
    source_path: plugins/svarp/run.py
    environment: plugins/svarp/envs/environment.yaml
    resource_class: tool_large
    active_when: {tool: svarp, task: prepare_assets}
  - id: tool__svarp__map
    description: Map the registered CLR reads to the frozen leave-HG002-out rGFA using minigraph.
    phase: tool_execution
    kind: plugin
    inputs: [bgzip_long_read_fasta, svarp_rgfa]
    outputs: [long_read_gaf]
    upstream: [tool__svarp__prepare_reads]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: implemented
    source_path: plugins/svarp/run.py
    environment: plugins/svarp/envs/environment.yaml
    resource_class: tool_large
    active_when: {tool: svarp, task: mapping}
  - id: tool__svarp__discover
    description: Assemble SVarp svtigs from long-read graph mappings.
    phase: tool_execution
    kind: plugin
    inputs: [long_read_gaf, svarp_rgfa, bgzip_long_read_fasta]
    outputs: [svtigs_fasta]
    upstream: [tool__svarp__map]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: implemented
    source_path: plugins/svarp/run.py
    environment: plugins/svarp/envs/environment.yaml
    resource_class: tool_large
    active_when: {tool: svarp, task: discovery}
  - id: tool__svarp__project_to_vcf
    description: Project sequence-resolved SVarp svtigs to a variant-sites VCF using frozen minimap2 and paftools versions.
    phase: tool_execution
    kind: plugin
    inputs: [svtigs_fasta, grch38_reference]
    outputs: [raw_variant_sites_vcf]
    upstream: [tool__svarp__discover]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: implemented
    source_path: plugins/svarp/run.py
    environment: plugins/svarp/envs/environment.yaml
    resource_class: tool_large
    active_when: {tool: svarp, task: postprocess}
