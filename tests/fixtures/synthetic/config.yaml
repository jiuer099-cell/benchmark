schema_version: 1

project:
  id: hg002_grch38_sv_benchmark
  run_id: synthetic_smoke

sample:
  id: HG002
  sex: male
  technology: pacbio_clr
  bam: tests/fixtures/synthetic/missing-development-only.bam
  fastq: null

reference:
  id: grch38
  fasta: tests/fixtures/synthetic/reference.fa

pangenome:
  id: synthetic_grch38_pg_v1
  backbone: grch38
  population_panel: synthetic_population_sv
  truth_leakage_policy: exclude_hg002_truth
  build_graph_assets: false
  allele_namespace: PGSV
  excluded_samples: [HG002, NA24385]
  population_vcf: null
  graph_assets:
    manifest: null
    gbz: null
    xg: null
    min: null
    dist: null
    sample_list: null
    reference_path: GRCh38

truth:
  primary: giab_hg002_grch38_v5_0q
  secondary: []

catalogs:
  truthsets: config/truthsets.yaml
  stratifications: config/stratifications.yaml
  score_weights: config/consensus_scoring.yaml
  metric_dictionary: config/metric_dictionary.yaml

execution:
  tracks:
    - end_to_end_from_reads
  official_score_mode: end_to_end_from_reads
  use_conda: false
  use_apptainer: false
  keep_going: true
  benchmark_repeats: 1
  random_seed: 20260717

development:
  synthetic_mode: true
  canonical_fastq: tests/fixtures/synthetic/reads.fastq
  population_vcf: tests/fixtures/synthetic/population.vcf
  truth_vcf: tests/fixtures/synthetic/truth.vcf
  benchmark_bed: tests/fixtures/synthetic/benchmark.bed
  evaluator_fixture_dir: tests/fixtures/synthetic/evaluators
  allow_missing_bam: true

score:
  profile: pgbench_consensus_v2
  final_score_name: ComparableScore
  produce_ranking: false

evaluation:
  evaluators: [truvari, aardvark, vcfdist]
  truth_vcf: null
  benchmark_bed: null
  vcfdist_credit_threshold: 0.7
  commands:
    bcftools: [bcftools]
    tabix: [tabix]
    truvari: [truvari]
    aardvark: [aardvark]
    vcfdist: [vcfdist]

obsidian:
  enabled: false
  vault_root: null
  vault_root_env: PGBENCH_OBSIDIAN_VAULT
  project_relpath: Research/hg002-grch38-pangenome-sv-benchmark
  canonical_note: Writing/HG002-GRCh38泛基因组SV-Benchmark设计规范.md
  binding_file: .claude/project-memory/hg002-grch38-pangenome-sv-benchmark.md

tools:
  enabled: []
  planned_tools:
    - sniffles2
    - sniffles2_force
    - kanpig
    - svjedi_graph

external_plugins:
  - id: example_genotyper
    manifest: plugins/example_genotyper/tool.yaml
