schema_version: 1

benchmark_contract:
  track: short_read_fixed_panel_genotyping
  read_class: short
  cross_track_ranking: false
  chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22]
  svtypes: [DEL, INS]
  minimum_sv_size: 50
  maximum_sv_size: 10000
  biallelic_only: true
  sequence_resolved_only: true
  truth_absence_policy: unscorable_without_explicit_reference_confidence
  coverage_levels: [10, 20, 30, full]
  downsampling_seeds: [1701, 1702, 1703]
  source_coverage_x: 30
  target_family_exclusion: [HG002, NA24385, HG003, NA24149, HG004, NA24143]
  score_status: experimental
  conclusion_scope: sample_and_configuration_specific
  independent_samples_status: not_available

project:
  id: hg002_grch38_sv_benchmark
  run_id: synthetic_smoke

sample:
  id: HG002
  sex: male
  technology: illumina_pe
  library_id: synthetic_illumina
  source_evidence_id: synthetic_reads
  coverage_x: 1.0
  read_count: 1
  read_bases: 10
  downsampling_seed: 20260716
  fastq_r1: tests/fixtures/synthetic/reads.R1.fastq
  fastq_r2: tests/fixtures/synthetic/reads.R2.fastq

reference:
  id: grch38
  fasta: tests/fixtures/synthetic/reference.fa

pangenome:
  id: synthetic_grch38_pg_v1
  backbone: grch38
  population_panel: synthetic_population_sv
  truth_leakage_policy: exclude_hg002_truth
  build_graph_assets: false
  allele_namespace: PGSV
  excluded_samples: [HG002, NA24385, HG003, NA24149, HG004, NA24143]
  frozen_haplotype_source_bundle:
    id: synthetic_grch38_pg_v1
    source_cohort_id: synthetic_population_sv
    release: synthetic_smoke_v1
    reference: grch38
    haplotype_manifest: tests/fixtures/synthetic/population.vcf
    target_family_excluded: true
    derivation_policy: native_assets_must_be_derived_from_this_bundle
    content_lock: tests/fixtures/synthetic/population.vcf
  canonical_scoring_contract:
    canonical_candidate_count: 18164
    tool_specific_denominator: forbidden
    deterministic_native_projection_required: true
  population_vcf: null
  graph_assets:
    profile: none
    manifest: null
    gbz: null
    xg: null
    min: null
    dist: null
    sample_list: null
    reference_path: GRCh38

truth:
  primary: giab_hg002_grch38_v5_0q
  secondary: []

catalogs:
  truthsets: config/truthsets.yaml
  stratifications: config/stratifications.yaml
  score_weights: config/me_f1_scoring.yaml
  evaluator_profile: config/evaluator_profile.yaml
  metric_dictionary: config/metric_dictionary.yaml
  allowed_information: config/allowed_information.yaml
  tuning_policy: config/tuning_policy.yaml
  panel_provenance: config/panel_provenance.yaml

execution:
  tracks:
    - end_to_end_from_reads
  official_score_mode: end_to_end_from_reads
  use_conda: false
  use_apptainer: false
  keep_going: true
  benchmark_repeats: 1
  cache_policy: isolated_empty_tool_cache
  random_seed: 20260717

development:
  synthetic_mode: true
  population_vcf: tests/fixtures/synthetic/population.vcf
  truth_vcf: tests/fixtures/synthetic/truth.vcf
  benchmark_bed: tests/fixtures/synthetic/benchmark.bed
  evaluator_fixture_dir: tests/fixtures/synthetic/evaluators

score:
  profile: pgbench_me_f1_v1
  final_score_name: ME-F1
  produce_ranking: true

evaluation:
  evaluators: [truvari, aardvark, vcfdist]
  truth_vcf: null
  benchmark_bed: null
  context_beds:
    non_repeat: tests/fixtures/synthetic/stratifications/difficult.bed
    tandem_repeat: tests/fixtures/synthetic/stratifications/difficult.bed
    segmental_duplication: tests/fixtures/synthetic/stratifications/difficult.bed
    low_complexity: tests/fixtures/synthetic/stratifications/difficult.bed
    low_mappability: tests/fixtures/synthetic/stratifications/difficult.bed
    other_difficult: tests/fixtures/synthetic/stratifications/difficult.bed
  commands:
    bcftools: [bcftools]
    tabix: [tabix]
    truvari: [truvari]
    aardvark: [aardvark]
    vcfdist: [vcfdist]

obsidian:
  enabled: false
  vault_root: null
  vault_root_env: PGBENCH_OBSIDIAN_VAULT
  project_relpath: Research/hg002-grch38-pangenome-sv-benchmark
  canonical_note: Writing/HG002-GRCh38泛基因组SV-Benchmark设计规范.md
  binding_file: .claude/project-memory/hg002-grch38-pangenome-sv-benchmark.md

tools:
  enabled: []
  planned_tools: []

external_plugins:
  - id: example_genotyper
    manifest: plugins/example_genotyper/tool.yaml
