  shared_bai: alignments/HG002.region.bam.bai
  long_fastq: reads/HG002.long.fastq.gz
  short_fastq_r1: reads/HG002.short.R1.fastq.gz
  short_fastq_r2: reads/HG002.short.R2.fastq.gz
  pangenie_panel_vcf: pangenome/pangenie.panel.vcf.gz
