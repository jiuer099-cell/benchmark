[project]
name = "pgbench-sv"
version = "0.1.0"
description = "Pangenome-first HG002 structural-variant benchmark"
requires-python = ">=3.11"
dependencies = [
  "edlib==1.3.9.post1; platform_system != 'Windows'",
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: tests that integrate repository contracts with external software or resources",
  "real_tools: opt-in checks for installed production tool binaries and bounded real-region resources",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
