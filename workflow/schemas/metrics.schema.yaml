$schema: https://json-schema.org/draft/2020-12/schema
$id: https://pgbench.local/schemas/metrics.schema.yaml
title: PGBench standardized metric records
type: object
additionalProperties: false
required:
  - schema_version
  - dictionary_id
  - tuple
  - records
properties:
  schema_version:
    const: 1
  dictionary_id:
    const: pgbench_metrics_v1
  tuple:
    type: object
    additionalProperties: false
    required:
      - run_id
      - sample_id
      - tool_id
      - official_score_mode
      - primary_truth_profile
      - score_profile
    properties:
      run_id:
        $ref: "#/$defs/identifier"
      sample_id:
        $ref: "#/$defs/identifier"
      tool_id:
        $ref: "#/$defs/identifier"
      official_score_mode:
        const: end_to_end_from_reads
      primary_truth_profile:
        $ref: "#/$defs/identifier"
      score_profile:
        const: pgbench_me_f1_v1
  records:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/metricRecord"
  analysis:
    oneOf:
      - $ref: "#/$defs/formalAnalysis"
      - $ref: "#/$defs/syntheticAnalysis"

$defs:
  identifier:
    type: string
    minLength: 1
    maxLength: 160
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
  metricId:
    enum:
      - benchmark.truth.eligible.count
      - diagnostic.evaluator_agreement.all_three_correct.count
      - diagnostic.evaluator_agreement.exactly_two_correct.count
      - diagnostic.evaluator_agreement.exactly_one_correct.count
      - diagnostic.evaluator_agreement.none_correct.count
      - truvari.event.overall.f1
      - truvari.event.svtype.macro_f1
      - truvari.event.length.macro_f1
      - truvari.gt.exact_concordance
      - truvari.match.sequence_similarity
      - truvari.match.size_similarity
      - truvari.match.start_accuracy
      - truvari.match.end_accuracy
      - truvari.match.mean_similarity
      - truvari.context.difficult.macro_f1
      - aardvark.haplotype.exact_f1
      - aardvark.haplotype.partial_f1
      - aardvark.gt.exact_concordance
      - aardvark.complex.exact_f1
      - aardvark.haplotype.sequence_similarity
      - vcfdist.representation.f1
      - vcfdist.gt.exact_concordance
      - vcfdist.phase.phased_gt_concordance
      - vcfdist.phase.switch_error_rate
      - vcfdist.phase.flip_error_rate
      - vcfdist.phase.accuracy
      - vcfdist.complex.consistency
      - vcfdist.eligible.coverage
      - truvari.pangenome.in_panel.gt.macro_f1
      - aardvark.pangenome.in_panel.gt.macro_f1
      - vcfdist.pangenome.in_panel.gt.macro_f1
      - pangenome.in_panel.gt.fused_macro_f1
      - pangenome.link.precision
      - pangenome.link.coverage
      - pangenome.af.fused_macro_f1
      - pangenome.graph.fused_macro_f1
      - pangenome.context.fused_macro_f1
      - pangenome.novel.fused_f1
      - resource.wall_time.hours
      - resource.peak_rss.gib
      - resource.disk_peak.gib
      - resource.cpu.hours
      - traceability.manifest_completeness
      - traceability.hash_lineage.complete
      - traceability.environment.complete
      - traceability.run_context.complete
  nullableNonnegativeNumber:
    oneOf:
      - type: number
        minimum: 0
      - type: "null"
  confidenceInterval:
    type: object
    additionalProperties: false
    required: [lower, upper, level, method, bootstrap_unit]
    properties:
      lower:
        type: number
      upper:
        type: number
      level:
        const: 0.95
      method:
        const: stratified_variant_cluster_bootstrap
      bootstrap_unit:
        const: truth_variant_cluster
  scoreConfidenceInterval:
    type: object
    additionalProperties: false
    required:
      - lower
      - upper
      - level
      - method
      - bootstrap_unit
      - replicates
      - seed_sha256
      - block_size_bp
      - block_count
    properties:
      lower:
        type: number
        minimum: 0
        maximum: 100
      upper:
        type: number
        minimum: 0
        maximum: 100
      level:
        const: 0.95
      method:
        const: paired_genomic_block_bootstrap
      bootstrap_unit:
        const: fixed_genomic_block
      block_size_bp:
        type: integer
        minimum: 1000000
      block_count:
        type: integer
        minimum: 1
      replicates:
        type: integer
        minimum: 100
      seed_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
  meF1Bootstrap:
    type: object
    additionalProperties: false
    required:
      - lower
      - upper
      - level
      - method
      - bootstrap_unit
      - replicates
      - seed_sha256
      - block_size_bp
      - block_count
      - replicate_me_f1
      - replicate_evaluator_f1
    properties:
      lower: {type: number, minimum: 0, maximum: 100}
      upper: {type: number, minimum: 0, maximum: 100}
      level: {const: 0.95}
      method: {const: paired_genomic_block_bootstrap}
      bootstrap_unit: {const: fixed_genomic_block}
      block_size_bp: {type: integer, minimum: 1000000}
      block_count: {type: integer, minimum: 1}
      replicates: {type: integer, minimum: 100}
      seed_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      replicate_me_f1:
        type: array
        minItems: 100
        items: {type: number, minimum: 0, maximum: 100}
      replicate_evaluator_f1:
        type: object
        additionalProperties: false
        required: [truvari, aardvark, vcfdist]
        properties:
          truvari:
            type: array
            minItems: 100
            items: {type: number, minimum: 0, maximum: 100}
          aardvark:
            type: array
            minItems: 100
            items: {type: number, minimum: 0, maximum: 100}
          vcfdist:
            type: array
            minItems: 100
            items: {type: number, minimum: 0, maximum: 100}
  evaluatorGtF1:
    type: object
    additionalProperties: false
    required: [tp, fp, fn, precision, recall, f1]
    properties:
      tp: {type: integer, minimum: 0}
      fp: {type: integer, minimum: 0}
      fn: {type: integer, minimum: 0}
      precision: {type: number, minimum: 0, maximum: 1}
      recall: {type: number, minimum: 0, maximum: 1}
      f1: {type: number, minimum: 0, maximum: 1}
  genotypeStratum:
    type: object
    additionalProperties: false
    required:
      - status
      - canonical_candidate_count
      - truth_positive_count
      - query_event_count
      - called_count
      - explicit_no_call_count
      - missing_output_count
      - unsupported_representation_count
      - linking_failure_count
      - addressable_count
      - addressability_rate
      - evaluator_metrics
      - me_f1
    properties:
      status: {enum: [defined, excluded_zero_truth]}
      canonical_candidate_count: {type: integer, minimum: 0}
      truth_positive_count: {type: integer, minimum: 0}
      query_event_count: {type: integer, minimum: 0}
      called_count: {type: integer, minimum: 0}
      explicit_no_call_count: {type: integer, minimum: 0}
      missing_output_count: {type: integer, minimum: 0}
      unsupported_representation_count: {type: integer, minimum: 0}
      linking_failure_count: {type: integer, minimum: 0}
      addressable_count: {type: integer, minimum: 0}
      addressability_rate:
        oneOf:
          - {type: number, minimum: 0, maximum: 1}
          - {type: "null"}
      evaluator_metrics:
        type: object
        additionalProperties: false
        properties:
          truvari: {$ref: "#/$defs/evaluatorGtF1"}
          aardvark: {$ref: "#/$defs/evaluatorGtF1"}
          vcfdist: {$ref: "#/$defs/evaluatorGtF1"}
      me_f1:
        oneOf:
          - {type: number, minimum: 0, maximum: 100}
          - {type: "null"}
  syntheticAnalysis:
    type: object
    additionalProperties: false
    required:
      - contract_version
      - evaluator_gt_metrics
      - quality_gates
      - panel_addressable_truth_count
      - evaluator_agreement_counts
      - evaluator_profile_sha256
    properties:
      contract_version:
        const: synthetic_genotype_me_f1_v1
      evaluator_gt_metrics:
        type: object
        additionalProperties: false
        required: [truvari, aardvark, vcfdist]
        properties:
          truvari: {$ref: "#/$defs/evaluatorGtF1"}
          aardvark: {$ref: "#/$defs/evaluatorGtF1"}
          vcfdist: {$ref: "#/$defs/evaluatorGtF1"}
      quality_gates:
        type: object
        additionalProperties: false
        required:
          - evaluator_semantic_contract_valid
          - addressability_complete
          - allowed_information_complete
          - tuning_frozen
          - context_stratification_complete
          - population_af_stratification_complete
        properties:
          evaluator_semantic_contract_valid: {const: true}
          addressability_complete: {const: true}
          allowed_information_complete: {const: true}
          tuning_frozen: {const: true}
          context_stratification_complete: {const: true}
          population_af_stratification_complete: {const: true}
      panel_addressable_truth_count: {type: integer, minimum: 1}
      evaluator_profile_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
      evaluator_agreement_counts:
        type: object
        additionalProperties: false
        required: [all_three_correct, exactly_two_correct, exactly_one_correct, none_correct]
        properties:
          all_three_correct: {type: integer, minimum: 0}
          exactly_two_correct: {type: integer, minimum: 0}
          exactly_one_correct: {type: integer, minimum: 0}
          none_correct: {type: integer, minimum: 0}
  formalAnalysis:
    type: object
    additionalProperties: false
    required:
      - contract_version
      - evaluator_profile_id
      - evaluator_profile_sha256
      - evaluator_bundle_sha256
      - evaluator_versions
      - evaluator_native_metrics
      - evaluator_gt_metrics
      - quality_gates
      - asset_hashes
      - evidence_profile
      - comparison_track
      - comparison_track_sha256
      - universe
      - matching
      - evaluator_event_mapping
      - maximum_unresolved_mapping_fraction
      - whole_truth_recovery_status
      - formal_score_status
      - formal_score_reason
      - whole_truth_recovery_score
      - pangenome_genotyping_score
      - non_reference_f1_score
      - panel_coverage
      - panel_truth_positive_events
      - panel_addressable_truth_count
      - me_f1
      - evaluator_range
      - evaluator_sd
      - leave_one_evaluator_out
      - evaluator_agreement_counts
      - whole_truth_recovery_confidence_interval
      - me_f1_confidence_interval
      - semantic_summary
      - candidate_genotype_summary
      - addressability_audit
      - stratified_summary
      - genotype_stratified_summary
      - resource_summary
    properties:
      contract_version:
        const: formal_genotype_me_f1_v1
      evaluator_profile_id:
        $ref: "#/$defs/identifier"
      evaluator_profile_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
      evaluator_bundle_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
      evaluator_versions:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          required: [output, sha256]
          properties:
            output:
              type: string
              minLength: 1
            sha256:
              type: string
              pattern: "^[0-9a-f]{64}$"
      evaluator_native_metrics:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          required:
            - unit
            - truth_true_positive
            - query_true_positive
            - truth_false_negative
            - query_false_positive
            - precision
            - recall
            - f1
          properties:
            unit: {type: string, minLength: 1}
            truth_true_positive: {type: integer, minimum: 0}
            query_true_positive: {type: integer, minimum: 0}
            truth_false_negative: {type: integer, minimum: 0}
            query_false_positive: {type: integer, minimum: 0}
            precision: {type: number, minimum: 0, maximum: 1}
            recall: {type: number, minimum: 0, maximum: 1}
            f1: {type: number, minimum: 0, maximum: 1}
      evaluator_gt_metrics:
        type: object
        additionalProperties: false
        required: [truvari, aardvark, vcfdist]
        properties:
          truvari: {$ref: "#/$defs/evaluatorGtF1"}
          aardvark: {$ref: "#/$defs/evaluatorGtF1"}
          vcfdist: {$ref: "#/$defs/evaluatorGtF1"}
      quality_gates:
        type: object
        additionalProperties: false
        required:
          - evaluator_semantic_contract_valid
          - addressability_complete
          - allowed_information_complete
          - tuning_frozen
          - context_stratification_complete
          - population_af_stratification_complete
        properties:
          evaluator_semantic_contract_valid: {type: boolean}
          addressability_complete: {type: boolean}
          allowed_information_complete: {type: boolean}
          tuning_frozen: {type: boolean}
          context_stratification_complete: {type: boolean}
          population_af_stratification_complete: {type: boolean}
      asset_hashes:
        type: object
        additionalProperties: false
        required:
          - reference
          - truth_vcf
          - benchmark_bed
          - pangenome_manifest
          - challenge_hidden_ledger
          - tool_manifest
          - graph_asset_lock
          - stratification_catalogue
          - context_beds
        properties:
          reference:
            type: string
            pattern: "^[0-9a-f]{64}$"
          truth_vcf:
            type: string
            pattern: "^[0-9a-f]{64}$"
          benchmark_bed:
            type: string
            pattern: "^[0-9a-f]{64}$"
          pangenome_manifest:
            description: >-
              Stable semantic content hash with volatile path and generation
              metadata removed; graph attachments are represented separately
              by graph_asset_lock, while all common panel checksums remain
              covered.
            type: string
            pattern: "^[0-9a-f]{64}$"
          challenge_hidden_ledger:
            type: string
            pattern: "^[0-9a-f]{64}$"
          tool_manifest:
            type: string
            pattern: "^[0-9a-f]{64}$"
          graph_asset_lock:
            description: >-
              Stable semantic graph-lock hash when this plugin consumes graph
              assets; null for plugins that do not.
            oneOf:
              - type: string
                pattern: "^[0-9a-f]{64}$"
              - type: "null"
          stratification_catalogue:
            type: string
            pattern: "^[0-9a-f]{64}$"
          context_beds:
            type: object
            additionalProperties:
              type: string
              pattern: "^[0-9a-f]{64}$"
      evidence_profile:
        type: object
        additionalProperties: false
        required:
          - contract
          - actual_technology
          - library_id
          - source_evidence_id
          - evidence_kind
          - official_score_mode
          - alignment_kind
          - input_assets
          - resolved_inputs_sha256
          - coverage_x
          - read_count
          - read_bases
          - downsampling_seed
          - quantitative_metadata_complete
        properties:
          contract:
            const: pgbench_evidence_v1
          actual_technology:
            const: illumina_short_read
          library_id:
            $ref: "#/$defs/identifier"
          source_evidence_id:
            $ref: "#/$defs/identifier"
          evidence_kind:
            enum: [paired_fastq, single_fastq, shared_alignment]
          official_score_mode:
            const: end_to_end_from_reads
          alignment_kind:
            oneOf:
              - type: string
                minLength: 1
              - type: "null"
          input_assets:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              additionalProperties: false
              required: [sha256, size_bytes, path_type]
              properties:
                sha256:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                size_bytes: {type: integer, minimum: 1}
                path_type: {enum: [file, directory]}
          resolved_inputs_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          coverage_x:
            oneOf:
              - type: number
                exclusiveMinimum: 0
              - type: "null"
          read_count:
            oneOf:
              - type: integer
                minimum: 1
              - type: "null"
          read_bases:
            oneOf:
              - type: integer
                minimum: 1
              - type: "null"
          downsampling_seed:
            oneOf:
              - type: integer
                minimum: 0
              - type: "null"
          quantitative_metadata_complete:
            type: boolean
      comparison_track:
        type: object
        additionalProperties: false
        required:
          - id
          - contract
          - task
          - official_score_mode
          - candidate_output_contract
          - actual_technology
          - primary_truth_profile
          - score_profile_sha256
          - evaluator_profile_sha256
          - reference_sha256
          - truth_vcf_sha256
          - benchmark_bed_sha256
          - pangenome_manifest_sha256
          - tool_manifest_sha256
          - evaluation_universe_sha256
          - input_evidence_sha256
        properties:
          id:
            type: string
            minLength: 1
          contract:
            const: pgbench_comparison_track_v1
          task:
            enum: [panel_genotyping, wg_discovery, novel_pangenome_discovery]
          official_score_mode:
            const: end_to_end_from_reads
          candidate_output_contract:
            const: all_sites
          actual_technology:
            const: illumina_short_read
          primary_truth_profile:
            $ref: "#/$defs/identifier"
          score_profile_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          evaluator_profile_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          reference_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          truth_vcf_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          benchmark_bed_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          pangenome_manifest_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          tool_manifest_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          evaluation_universe_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          input_evidence_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
      comparison_track_sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
      universe:
        type: object
        additionalProperties: false
        required:
          - truth_filter_policy
          - query_filter_policy
          - minimum_sv_size
          - maximum_sv_size
          - allowed_svtypes
          - biallelic_only
          - multiallelic_policy
          - region_policy
        properties:
          truth_filter_policy:
            const: pass_only
          query_filter_policy:
            const: pass_or_unfiltered
          minimum_sv_size:
            type: integer
            minimum: 1
          maximum_sv_size:
            type: integer
            minimum: 1
          allowed_svtypes:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              enum: [DEL, INS]
          biallelic_only:
            const: true
          multiallelic_policy:
            const: exclude
          region_policy:
            const: fully_contained
      matching:
        type: object
        additionalProperties: false
        required:
          - algorithm
          - unique_truth_accounting
          - credited_truth_events
          - eligible_truth_event_count
          - query_event_count
          - soft_true_positive_count
        properties:
          algorithm:
            const: deterministic_max_cardinality_max_weight_one_to_one_v1
          unique_truth_accounting:
            type: boolean
          credited_truth_events:
            type: integer
            minimum: 0
          eligible_truth_event_count:
            type: integer
            minimum: 0
          query_event_count:
            type: integer
            minimum: 0
          soft_true_positive_count:
            type: number
            minimum: 0
      evaluator_event_mapping:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          required: [event_count, resolved_events, unresolved_events, mapping_coverage]
          properties:
            event_count: {type: integer, minimum: 0}
            resolved_events: {type: integer, minimum: 0}
            unresolved_events: {type: integer, minimum: 0}
            mapping_coverage: {type: number, minimum: 0, maximum: 1}
      maximum_unresolved_mapping_fraction:
        type: number
        minimum: 0
        maximum: 1
      whole_truth_recovery_status:
        enum: [valid, invalid_unresolved_mapping]
      formal_score_status:
        enum: [valid, invalid_evaluator_mapping, invalid_empty_submission]
      formal_score_reason:
        oneOf:
          - type: string
            minLength: 1
          - type: "null"
      whole_truth_recovery_score:
        type: number
        minimum: 0
        maximum: 100
      pangenome_genotyping_score:
        oneOf:
          - type: number
            minimum: 0
            maximum: 100
          - type: "null"
      non_reference_f1_score:
        oneOf:
          - type: number
            minimum: 0
            maximum: 100
          - type: "null"
      panel_coverage:
        oneOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: "null"
      panel_truth_positive_events:
        type: integer
        minimum: 0
      panel_addressable_truth_count:
        type: integer
        minimum: 1
      me_f1:
        type: number
        minimum: 0
        maximum: 100
      evaluator_range:
        type: number
        minimum: 0
        maximum: 100
      evaluator_sd:
        type: number
        minimum: 0
        maximum: 100
      leave_one_evaluator_out:
        type: object
        additionalProperties: false
        required: [truvari, aardvark, vcfdist]
        properties:
          truvari: {type: number, minimum: 0, maximum: 100}
          aardvark: {type: number, minimum: 0, maximum: 100}
          vcfdist: {type: number, minimum: 0, maximum: 100}
      evaluator_agreement_counts:
        type: object
        additionalProperties: false
        required: [all_three_correct, exactly_two_correct, exactly_one_correct, none_correct]
        properties:
          all_three_correct: {type: integer, minimum: 0}
          exactly_two_correct: {type: integer, minimum: 0}
          exactly_one_correct: {type: integer, minimum: 0}
          none_correct: {type: integer, minimum: 0}
      whole_truth_recovery_confidence_interval:
        oneOf:
          - $ref: "#/$defs/scoreConfidenceInterval"
          - type: "null"
      me_f1_confidence_interval:
        $ref: "#/$defs/meF1Bootstrap"
      semantic_summary:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          required:
            - query_rows
            - scope_eligible
            - scope_excluded
            - detection_events
            - detection_correct
            - genotype_scorable
            - genotype_correct
            - no_call
          properties:
            query_rows: {type: integer, minimum: 0}
            scope_eligible: {type: integer, minimum: 0}
            scope_excluded: {type: integer, minimum: 0}
            detection_events: {type: integer, minimum: 0}
            detection_correct: {type: integer, minimum: 0}
            genotype_scorable: {type: integer, minimum: 0}
            genotype_correct: {type: integer, minimum: 0}
            no_call: {type: integer, minimum: 0}
      candidate_genotype_summary:
        oneOf:
          - type: "null"
          - type: object
            additionalProperties: false
            required:
              - contract
              - candidate_output_contract
              - absence_semantics
              - no_call_is_incorrect
              - query_record_count
              - unmapped_query_records
              - direct_candidate_records
              - linked_candidate_records
              - candidate_link_conflicts
              - duplicate_candidate_records
              - conflicting_duplicate_candidates
              - rejected_link_records
              - candidate_count
              - truth_scorable
              - truth_positive
              - truth_negative
              - truth_unscorable
              - observed_candidates
              - observed_truth_scorable_candidates
              - inferred_absent_candidates
              - inferred_absent_truth_scorable_candidates
              - genotype_scorable
              - called_candidates
              - genotype_correct
              - genotype_accuracy
              - called_only_genotype_accuracy
              - genotype_confusion_matrix
              - genotype_class_metrics
              - genotype_macro_f1
              - binary_nonref_confusion
              - nonref_precision
