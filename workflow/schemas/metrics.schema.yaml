  metricRecord:
    type: object
    additionalProperties: false
    required:
      - metric_id
      - value_type
      - value
      - status
      - evaluator
      - numerator
      - denominator
      - eligible_count
      - universe_id
      - undefined_reason
      - parser_id
      - parser_source_field
      - provenance_manifest_id
      - strata
    properties:
      metric_id:
        $ref: "#/$defs/metricId"
      value_type:
        enum: [ratio, count, duration, size, boolean, points]
      value:
        oneOf:
          - type: number
          - type: boolean
          - type: "null"
      status:
        enum:
          - defined
          - undefined
          - completed_with_tool_ineligible_zero
          - not_applicable
      evaluator:
        oneOf:
          - enum:
              - truvari
              - aardvark
              - vcfdist
              - fusion
              - pangenome_linker
              - resource_collector
              - provenance_audit
          - type: "null"
      numerator:
        $ref: "#/$defs/nullableNonnegativeNumber"
      denominator:
        $ref: "#/$defs/nullableNonnegativeNumber"
      eligible_count:
        oneOf:
          - type: integer
            minimum: 0
          - type: "null"
      universe_id:
        type: string
        minLength: 1
      undefined_reason:
        oneOf:
          - type: string
            minLength: 1
          - type: "null"
      parser_id:
        type: string
        minLength: 1
      parser_source_field:
        type: string
        minLength: 1
      provenance_manifest_id:
        type: string
        minLength: 1
      strata:
        type: object
        additionalProperties:
          type: string
      confidence_interval:
        oneOf:
          - $ref: "#/$defs/confidenceInterval"
          - type: "null"
    allOf:
      - if:
          properties:
            value_type:
              const: ratio
            status:
              enum: [defined, completed_with_tool_ineligible_zero]
          required: [value_type, status]
        then:
          properties:
            value:
              type: number
              minimum: 0.0
              maximum: 1.0
      - if:
          properties:
            value_type:
              enum: [count, duration, size, points]
            status:
              enum: [defined, completed_with_tool_ineligible_zero]
          required: [value_type, status]
        then:
          properties:
            value:
              type: number
              minimum: 0.0
      - if:
          properties:
            value_type:
              const: boolean
            status:
              const: defined
          required: [value_type, status]
        then:
          properties:
            value:
              type: boolean
      - if:
          properties:
            status:
              enum: [undefined, not_applicable]
          required: [status]
        then:
          properties:
            value:
              type: "null"
            undefined_reason:
              type: string
              minLength: 1
            confidence_interval:
              type: "null"
      - if:
          properties:
            status:
              const: completed_with_tool_ineligible_zero
          required: [status]
        then:
          properties:
            value:
              const: 0
            undefined_reason:
              type: string
              minLength: 1
      - if:
          properties:
            status:
              const: defined
          required: [status]
        then:
          properties:
            undefined_reason:
              type: "null"
