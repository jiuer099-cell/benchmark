$schema: https://json-schema.org/draft/2020-12/schema
$id: https://pgbench.local/schemas/tool.schema.yaml
title: PGBench short-read fixed-panel adapter manifest
type: object
additionalProperties: false
required: [interface_version, id, version, source, paradigm, comparison_task, information_inputs, information_contract, tasks, inputs, capabilities, execution, supported_modes, outputs]
properties:
  interface_version: {const: 1}
  id: {$ref: "#/$defs/identifier"}
  name: {type: string, minLength: 1}
  version: {type: string, minLength: 1}
  source: {enum: [builtin, external]}
  paradigm: {enum: [short_read_pangenome_genotyping, graph_pangenome, genotyping_only]}
  comparison_task: {const: panel_genotyping}
  information_inputs:
    type: array
    minItems: 3
    uniqueItems: true
    items:
      enum:
        - target_short_reads
        - reference_grch38
        - canonical_candidate_panel
        - benchmark_panel_haplotypes
        - benchmark_panel_af_ac
        - benchmark_supplied_graph_assets
        - benchmark_supplied_tool_index
  information_contract:
    type: object
    additionalProperties: false
    required: [allowed_inputs_manifested, target_truth_used_for_calling, target_assembly_used, target_family_genotypes_used, target_specific_external_callset, tuning_mode, parameter_source]
    properties:
      allowed_inputs_manifested: {const: true}
      target_truth_used_for_calling: {const: false}
      target_assembly_used: {const: false}
      target_family_genotypes_used: {const: false}
      target_specific_external_callset: {const: false}
      tuning_mode: {enum: [official_default, official_recommended_sv_config, validation_tuned]}
      parameter_source: {enum: [official_default, official_documentation, independent_validation_sample]}
  tasks:
    type: array
    minItems: 1
    uniqueItems: true
    items: {enum: [prepare_assets, index, mapping, calling, genotyping, postprocess]}
  inputs:
    type: object
    additionalProperties: false
    required: [reference, candidates, pangenome_manifest, pangenome_panel, graph_assets]
    properties:
      reference: {$ref: "#/$defs/requirement"}
      candidates: {$ref: "#/$defs/requirement"}
      pangenome_manifest: {$ref: "#/$defs/requirement"}
      pangenome_panel: {$ref: "#/$defs/requirement"}
      graph_assets: {$ref: "#/$defs/graphRequirement"}
  capabilities:
    type: object
    additionalProperties: false
    required: [technology, svtypes, phasing, novel_discovery, allele_linkage_output, allele_namespace]
    properties:
      technology: {const: [illumina_short_read]}
      svtypes:
        type: array
        minItems: 2
        maxItems: 2
        uniqueItems: true
        items: {enum: [DEL, INS]}
        allOf:
          - contains: {const: DEL}
          - contains: {const: INS}
      phasing: {type: boolean}
      novel_discovery: {const: false}
      allele_linkage_output: {enum: [native, benchmark_inferred]}
      allele_namespace:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
  execution:
    type: object
    additionalProperties: false
    required: [runner, environment, rule_registry, trust_level, sandbox_backend]
    properties:
      runner: {$ref: "#/$defs/nonEmptyPath"}
      environment: {$ref: "#/$defs/nonEmptyPath"}
      rule_registry: {$ref: "#/$defs/nonEmptyPath"}
      trust_level: {enum: [untrusted, trusted_reviewed]}
      sandbox_backend: {enum: [none, apptainer, bwrap]}
  parameter_contract:
    type: object
    additionalProperties: false
    required: [contract, source_release, explicit, implicit]
    properties:
      contract: {const: pgbench_tool_parameters_v1}
      source_release:
        type: object
        additionalProperties: false
        required: [tag, commit, source_url, archive_sha256]
        properties:
          tag: {type: string, minLength: 1}
          commit: {type: string, pattern: "^[0-9a-f]{40}$"}
          source_url: {type: string, minLength: 1}
          archive_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      explicit: {type: object, minProperties: 1}
      implicit: {type: object, minProperties: 1}
  supported_modes:
    type: object
    additionalProperties: false
    required: [end_to_end_from_reads]
    properties:
      end_to_end_from_reads: {$ref: "#/$defs/modeContract"}
  outputs:
    type: object
    additionalProperties: false
    required: [vcf, candidate_output_contract, absence_semantics]
    properties:
      vcf:
        type: string
        minLength: 5
        pattern: "^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$)).+\\.vcf(?:\\.gz)?$"
      candidate_output_contract: {const: all_sites}
      absence_semantics: {const: no_call}

$defs:
  identifier:
    type: string
    minLength: 1
    maxLength: 128
    pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]*$"
  nonEmptyPath: {type: string, minLength: 1}
  requirement: {enum: [required, optional, forbidden]}
  graphRequirement:
    type: object
    additionalProperties: false
    required: [required, accepted_formats, accepted_profiles]
    properties:
      required: {type: boolean}
      accepted_formats:
        type: array
        uniqueItems: true
        items: {enum: [gbz, xg_gbwt, vcf, other]}
      accepted_profiles:
        type: array
        uniqueItems: true
        items: {enum: [vg_gbz_min_dist, vg_giraffe_shortread]}
  modeInput:
    enum: [short_fastq_r1, short_fastq_r2, reference, reference_index, pangenome_manifest, pangenome_panel, candidate_panel, allele_fasta, graph_assets, tool_index, pangenie_private_phased_panel, pangenie_private_biallelic_panel, pangenie_biallelic_converter, canonical_allele_projection]
  billableStage:
    enum: [prepare_assets, index, map, call, genotype, postprocess]
  modeContract:
    type: object
    additionalProperties: false
    required: [required_inputs, optional_inputs, billable_stages]
    properties:
      required_inputs:
        type: array
        minItems: 2
        uniqueItems: true
        allOf:
          - contains: {const: short_fastq_r1}
          - contains: {const: short_fastq_r2}
        items: {$ref: "#/$defs/modeInput"}
      optional_inputs:
        type: array
        uniqueItems: true
        items: {$ref: "#/$defs/modeInput"}
      billable_stages:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: "#/$defs/billableStage"}
