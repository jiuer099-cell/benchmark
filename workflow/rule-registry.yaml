schema_version: 1
rules:
  - id: validate_config
    description: Validate the frozen short-read benchmark configuration and adapter manifests.
    phase: validation
    kind: core
    inputs: [config, schemas]
    outputs: [validated_config_json]
    upstream: []
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/rules/common.smk
    environment: workflow/envs/core.yaml
    resource_class: local_small
  - id: snapshot_run_context
    description: Freeze software, hardware, configuration, seed, and environment context.
    phase: provenance
    kind: core
    inputs: [validated_config_json, score_profile]
    outputs: [run_context_json]
    upstream: [validate_config]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/rules/common.smk
    environment: workflow/envs/core.yaml
    resource_class: local_small
  - id: prepare_primary_truth
    description: Freeze the independent GRCh38 truth and autosomal benchmark regions.
    phase: truth
    kind: core
    inputs: [truth_vcf, benchmark_bed, reference_fasta]
    outputs: [primary_truth_vcf, primary_truth_tbi, primary_truth_audit]
    upstream: [snapshot_run_context]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/prepare_sv_truth.py
    environment: workflow/envs/core.yaml
    resource_class: local_medium
  - id: build_pangenome_manifest
    description: Build the family-aware leave-one-out population panel and canonical IDs.
    phase: pangenome
    kind: core
    inputs: [population_vcf, reference_fasta]
    outputs: [canonical_panel_vcf, allele_ledger_tsv, pangenome_manifest_yaml]
    upstream: [snapshot_run_context]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/build_pangenome_manifest.py
    environment: workflow/envs/core.yaml
    resource_class: local_medium
  - id: lock_graph_assets
    description: Verify and freeze any adapter-specific graph assets built from the same population source.
    phase: pangenome
    kind: core
    inputs: [pangenome_manifest_yaml]
    outputs: [graph_asset_lock_yaml]
    upstream: [build_pangenome_manifest]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/validate_graph_assets.py
    environment: workflow/envs/core.yaml
    resource_class: local_medium
  - id: build_blinded_challenge_panel
    description: Freeze the truth-independent main-track panel and hidden panel-addressable truth labels.
    phase: challenge_panel
    kind: core
    inputs: [canonical_panel_vcf, primary_truth_vcf, benchmark_bed]
    outputs: [blinded_panel_vcf, hidden_truth_ledger_tsv, panel_scope_tsv, challenging_panel_vcf, challenge_audit_json]
    upstream: [prepare_primary_truth, build_pangenome_manifest]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/build_challenge_panel.py
    environment: workflow/envs/core.yaml
    resource_class: local_medium
  - id: validate_evaluator_semantics
    description: Validate the three evaluator parsers against the versioned genotype-semantic cases.
    phase: validation
    kind: core
    inputs: [semantic_cases, evaluator_profile]
    outputs: [semantic_validation_json]
    upstream: [validate_config]
    audit_scope: formal_validity_gate
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/validate_evaluator_semantics.py
    environment: workflow/envs/core.yaml
    resource_class: local_small
  - id: freeze_information_contract
    description: Materialize allowed inputs, resource hashes, frozen parameters, and tuning status.
    phase: provenance
    kind: core
    inputs: [tool_manifest, resolved_inputs_json]
    outputs: [allowed_inputs_json, parameter_manifest_json, external_resource_hashes_json, tuning_status_json]
    upstream: [snapshot_run_context]
    audit_scope: formal_validity_gate
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/freeze_information_contract.py
    environment: workflow/envs/core.yaml
    resource_class: local_small
  - id: build_coverage_datasets
    description: Build byte-identical paired FASTQ subsets for 10x, 20x, 30x, and full-depth replicates.
    phase: preprocessing
    kind: core
    inputs: [short_fastq_r1, short_fastq_r2]
    outputs: [coverage_manifest_json]
    upstream: [snapshot_run_context]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/build_coverage_fastqs.py
    environment: workflow/envs/core.yaml
    resource_class: compute_medium
  - id: "tool__{tool}__execute"
    description: Execute one adapter from the common paired FASTQ and frozen candidate panel.
    phase: tool_execution
    kind: tool_template
    inputs: [short_fastq_r1, short_fastq_r2, blinded_panel_vcf]
    outputs: [raw_tool_vcf, resolved_inputs_json]
    upstream: [build_blinded_challenge_panel, build_coverage_datasets]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/pgbench_exec.py
    environment: null
    resource_class: compute_large
  - id: canonicalize_vcf
    description: Normalize tool VCF output without changing missing genotypes.
    phase: normalization
    kind: core
    inputs: [raw_tool_vcf, reference_fasta]
    outputs: [normalized_vcf]
    upstream: ["tool__{tool}__execute"]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/normalize_sv_vcf.py
    environment: workflow/envs/core.yaml
    resource_class: local_medium
  - id: link_pangenome_alleles
    description: Link normalized tool alleles to frozen canonical candidate IDs.
    phase: normalization
    kind: core
    inputs: [normalized_vcf, allele_ledger_tsv]
    outputs: [linked_vcf, allele_linkage_tsv]
    upstream: [canonicalize_vcf]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/link_pangenome_alleles.py
    environment: workflow/envs/core.yaml
    resource_class: local_medium
  - id: materialize_all_sites
    description: Project every tool answer onto every frozen candidate and emit addressability failures explicitly.
    phase: normalization
    kind: core
    inputs: [linked_vcf, blinded_panel_vcf]
    outputs: [all_sites_vcf, addressability_tsv, addressability_audit_json]
    upstream: [link_pangenome_alleles]
    audit_scope: formal_validity_gate
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/materialize_all_sites.py
    environment: workflow/envs/core.yaml
    resource_class: local_medium
  - id: evaluate_truvari
    description: Run genotype-aware Truvari and emit benchmark-defined TP FP FN.
    phase: evaluation
    kind: core
    inputs: [all_sites_vcf, primary_truth_vcf, evaluator_profile]
    outputs: [truvari_ledger_tsv]
    upstream: [materialize_all_sites, validate_evaluator_semantics]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/run_formal_evaluator.py
    environment: workflow/envs/core.yaml
    resource_class: compute_medium
  - id: evaluate_aardvark
    description: Run Aardvark GT mode and emit benchmark-defined TP FP FN.
    phase: evaluation
    kind: core
    inputs: [all_sites_vcf, primary_truth_vcf, evaluator_profile]
    outputs: [aardvark_ledger_tsv]
    upstream: [materialize_all_sites, validate_evaluator_semantics]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/run_formal_evaluator.py
    environment: workflow/envs/core.yaml
    resource_class: compute_medium
  - id: evaluate_vcfdist
    description: Run genotype-aware vcfdist and emit benchmark-defined TP FP FN.
    phase: evaluation
    kind: core
    inputs: [all_sites_vcf, primary_truth_vcf, evaluator_profile]
    outputs: [vcfdist_ledger_tsv]
    upstream: [materialize_all_sites, validate_evaluator_semantics]
    audit_scope: pre_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/run_formal_evaluator.py
    environment: workflow/envs/core.yaml
    resource_class: compute_medium
  - id: compute_me_f1
    description: Compute ME-F1 as the arithmetic mean of the three evaluator F1 values.
    phase: scoring
    kind: core
    inputs: [evaluator_ledgers, addressability_audit_json, information_contracts]
    outputs: [score_json]
    upstream: [evaluate_truvari, evaluate_aardvark, evaluate_vcfdist, freeze_information_contract]
    audit_scope: formal_validity_gate
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/pgbench_scoring.py
    environment: workflow/envs/core.yaml
    resource_class: local_small
  - id: finalize_score_provenance
    description: Seal the score and its complete provenance lineage.
    phase: provenance
    kind: post_score
    inputs: [score_json, rule_manifests]
    outputs: [sealed_score_package]
    upstream: [compute_me_f1]
    audit_scope: post_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/finalize_score_provenance.py
    environment: workflow/envs/core.yaml
    resource_class: local_small
  - id: render_report
    description: Render the main and stratified short-read benchmark report.
    phase: reporting
    kind: post_score
    inputs: [sealed_score_package]
    outputs: [report_html]
    upstream: [finalize_score_provenance]
    audit_scope: post_score
    manifest_required: true
    log_required: true
    benchmark_required: true
    implementation_status: verified
    source_path: workflow/scripts/render_report.py
    environment: workflow/envs/core.yaml
    resource_class: local_small
